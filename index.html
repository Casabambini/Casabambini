<body>
<div id="app"></div>
<div id="sheet"></div>
<script src="ideen.js"></script>
<script>
"use strict";
/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const nowT = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtD = s => s ? parseD(s).toLocaleDateString('de-DE', {day:'2-digit', month:'2-digit', year:'numeric'}) : '';
const fmtLong = s => parseD(s).toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const mins = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmtH = m => `${Math.floor(m/60)} Std ${pad(m%60)} Min`;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const MONTHS = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function ageText(birth) {
  if (!birth) return '';
  const b = parseD(birth), n = new Date();
  let m = (n.getFullYear()-b.getFullYear())*12 + n.getMonth()-b.getMonth();
  if (n.getDate() < b.getDate()) m--;
  if (m < 0) return '';
  if (m < 24) return `${m} Monat${m===1?'':'e'}`;
  const y = Math.floor(m/12), r = m % 12;
  return `${y} Jahre` + (r ? ` ${r} Mon.` : '');
}
function daysToBirthday(birth) {
  if (!birth) return null;
  const b = parseD(birth), n = parseD(today());
  let next = new Date(n.getFullYear(), b.getMonth(), b.getDate());
  if (next < n) next = new Date(n.getFullYear()+1, b.getMonth(), b.getDate());
  return Math.round((next - n) / 864e5);
}
function careDays(a, b) { // Werktage ohne Schließtage und eigenen Urlaub aus dem Kalender
  let c = 0;
  for (let d = new Date(a); d <= b; d.setDate(d.getDate()+1)) {
    const w = d.getDay(); if (!w || w > 5) continue;
    const ds = dstr(d); if (db.events.some(e => (e.type === 'closed' || e.type === 'vacation') && e.date <= ds && (e.end || e.date) >= ds)) continue;
    c++;
  }
  return c;
}
function weekdaysBetween(a, b) { // a,b Date, inklusiv
  let c = 0;
  for (let d = new Date(a); d <= b; d.setDate(d.getDate()+1)) { const w = d.getDay(); if (w && w < 6) c++; }
  return c;
}

/* ---------- Verschlüsselter Speicher ---------- */
const VAULT = 'kinderstube_vault_v1';
let db = null, key = null, salt = null, ui = {tab:'heute', month: today().slice(0,7)};
const b64 = buf => { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pw, salt) {
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, k, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function decryptVault(v, pw) {
  const s = unb64(v.salt), k = await deriveKey(pw, s);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: unb64(v.iv)}, k, unb64(v.data));
  return {db: JSON.parse(new TextDecoder().decode(pt)), key: k, salt: s};
}
async function makeVault() {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(db)));
  return {v:1, salt: b64(salt), iv: b64(iv), data: b64(ct)};
}
let saving = Promise.resolve();
function save() {
  saving = saving.then(async () => {
    if (!db) return;
    try { localStorage.setItem(VAULT, JSON.stringify(await makeVault())); }
    catch (e) { alert('Speichern nicht möglich (Speicher voll?). Bitte erstelle ein Backup und lösche ggf. Fotos.'); }
  });
  return saving;
}
const emptyDb = () => ({children: [], att: [], docs: [], obs: [], events: [], pay: [], fin: [], files: [], shop: [], todo: [], dayplan: {}, chk: {}, customTasks: [], customHyg: [], week: [], notes: {}, phase: '', lastBackup: null});
const norm = () => { db.docs ||= []; db.obs ||= []; db.events ||= []; db.pay ||= []; db.fin ||= []; db.files ||= []; db.shop ||= []; db.todo ||= []; db.dayplan ||= {}; db.chk ||= {}; db.customTasks ||= []; db.customHyg ||= []; db.week ||= []; db.notes ||= {}; };

/* ---------- Sperrbildschirm ---------- */
function renderLock(msg = '') {
  $('#sheet').className = ''; $('#sheet').innerHTML = '';
  const has = !!localStorage.getItem(VAULT);
  if (!window.crypto || !crypto.subtle) {
    $('#app').innerHTML = `<div class="lock"><div class="logo">⚠️</div><h1>Nicht möglich</h1><p>Dieser Browser/diese Adresse unterstützt keine sichere Verschlüsselung. Bitte die App über eine https-Adresse oder als lokale Datei öffnen.</p></div>`;
    return;
  }
  $('#app').innerHTML = `<div class="lockwrap"><div class="lock">
    <img class="lockimg" src="logo.jpg" alt="Logo Casa Bambini"><h1>Casa Bambini</h1><div class="mini" style="margin-bottom:10px">Ein Haus für kleine Herzen</div>
    <p class="mute">${has ? 'Bitte Passwort eingeben, um die Daten zu öffnen.' : 'Willkommen! Lege zuerst ein Passwort fest. Alle Daten werden damit verschlüsselt und bleiben nur auf diesem Gerät.'}</p>
    ${msg ? `<div class="alert">${esc(msg)}</div>` : ''}
    <label for="pw" style="text-align:left">Passwort</label>
    <input id="pw" type="password" autocomplete="${has ? 'current-password' : 'new-password'}" autofocus>
    ${has ? '' : `<label for="pw2" style="text-align:left">Passwort wiederholen</label><input id="pw2" type="password" autocomplete="new-password">
    <div class="alert" style="text-align:left;margin-top:14px">Wichtig: Wer das Passwort vergisst, kommt nicht mehr an die Daten. Es gibt keine Wiederherstellung. Bitte das Passwort sicher notieren und regelmäßig ein Backup machen.</div>`}
    <div class="btns"><button class="btn go full" data-act="unlock">${has ? 'Öffnen' : 'Passwort festlegen'}</button></div>
  </div></div>`;
}
async function doUnlock() {
  const pw = $('#pw').value, has = !!localStorage.getItem(VAULT);
  if (pw.length < 6) return renderLock('Das Passwort muss mindestens 6 Zeichen haben.');
  const btn = document.querySelector('[data-act=unlock]'); btn.textContent = 'Einen Moment …'; btn.disabled = true;
  if (has) {
    try {
      const r = await decryptVault(JSON.parse(localStorage.getItem(VAULT)), pw);
      db = r.db; key = r.key; salt = r.salt;
    } catch (e) { return renderLock('Falsches Passwort. Bitte nochmal versuchen.'); }
  } else {
    if (pw !== $('#pw2').value) return renderLock('Die beiden Passwörter sind nicht gleich.');
    salt = crypto.getRandomValues(new Uint8Array(16)); key = await deriveKey(pw, salt);
    db = emptyDb(); await save();
  }
  norm(); ui.tab = 'heute'; touch(); render();
}
function lock() { db = null; key = null; closeSheet(); renderLock(); }
let lockTimer;
function touch() { clearTimeout(lockTimer); if (db) lockTimer = setTimeout(lock, 10*60*1000); }
['click','keydown','touchstart'].forEach(e => document.addEventListener(e, touch, {passive:true}));

/* ---------- Daten-Zugriff ---------- */
const kid = id => db.children.find(c => c.id === id);
const getAtt = (cid, date) => db.att.find(a => a.child === cid && a.date === date);
function setAtt(cid, date, patch) {
  let a = getAtt(cid, date);
  if (!a) { a = {id: uid(), child: cid, date, type: 'present', in: '', out: ''}; db.att.push(a); }
  Object.assign(a, patch); save(); return a;
}
function delAtt(cid, date) { db.att = db.att.filter(a => !(a.child === cid && a.date === date)); save(); }
function monthStats(c, ym) {
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  const recs = db.att.filter(a => a.child === c.id && a.date.startsWith(ym));
  let ist = 0, sick = 0, vac = 0, missing = 0, days = 0;
  recs.forEach(a => {
    if (a.type === 'sick') sick++; else if (a.type === 'vacation') vac++;
    else { if (a.in && a.out) { ist += Math.max(0, mins(a.out) - mins(a.in)); days++; } else if (a.date < today()) missing++; }
  });
  const from = c.start && parseD(c.start) > first ? parseD(c.start) : first;
  const soll = from > last ? 0 : Math.round((+c.hours || 0) * 60 / 5 * careDays(from, last));
  return {ist, soll, sick, vac, missing, days, recs};
}

/* ---------- Rendering ---------- */
function avatar(c, big) {
  const cls = 'avatar' + (big ? ' big' : '');
  return c.photo ? `<img class="${cls}" src="${c.photo}" alt="">` : `<div class="${cls}">${esc((c.name || '?').trim().charAt(0).toUpperCase())}</div>`;
}
function healthTags(c) {
  let h = '';
  if (c.allergies) h += `<span class="tag bad">⚠ Allergie: ${esc(c.allergies)}</span>`;
  if (c.intolerances) h += `<span class="tag bad">Unverträglich: ${esc(c.intolerances)}</span>`;
  if (c.meds) h += `<span class="tag bad">💊 ${esc(c.meds)}</span>`;
  return h;
}
function render() {
  if (!db) return renderLock();
  const tabs = [['heute','🏠','Heute'],['kinder','👧','Kinder'],['kalender','📅','Kalender'],['stunden','⏱️','Stunden'],['finanzen','💶','Geld'],['mehr','⚙️','Mehr']];
  const body = {heute: viewHeute, kinder: viewKinder, kalender: viewKalender, stunden: viewStunden, finanzen: viewFinanzen, dok: viewDok, liste: viewListe, routine: viewRoutine, woche: viewWoche, hygiene: viewHygiene, ideen: viewIdeen, notizen: viewNotizen, mehr: viewMehr}[ui.tab]();
  $('#app').innerHTML = `<div class="wrap"><div class="hero"><div class="brandrow"><img class="logo" src="logo.jpg" alt="Logo Casa Bambini"><div><div class="brand">Casa Bambini</div><div class="tagline">Ein Haus für kleine Herzen</div></div></div><div id="herotitle"></div></div><div class="pull">${body}</div></div><nav>${tabs.map(([k,i,l]) => `<button class="${ui.tab===k || (k==='mehr' && ['dok','liste'].includes(ui.tab)) || (k==='heute' && ['routine','woche','hygiene','ideen','notizen'].includes(ui.tab)) ?'on':''}" data-act="tab" data-v="${k}"><span>${i}</span>${l}</button>`).join('')}</nav>`;
  const h1 = document.querySelector('.pull > h1');
  if (h1) {
    const sub = h1.nextElementSibling, t = $('#herotitle'); t.appendChild(h1);
    if (sub && sub.classList.contains('mute') && ui.tab === 'heute') t.appendChild(sub);
  }
}

function viewHeute() {
  const t = today(), kids = db.children;
  const recs = Object.fromEntries(kids.map(c => [c.id, getAtt(c.id, t)]));
  const here = kids.filter(c => recs[c.id]?.type === 'present' && recs[c.id].in && !recs[c.id].out);
  const hints = here.filter(c => c.allergies || c.intolerances || c.meds || c.notes);
  const bdays = kids.map(c => [c, daysToBirthday(c.birth)]).filter(([c, d]) => d !== null && d <= 7);
  let h = `<h1>Heute</h1><div class="mute">${fmtLong(t)}</div>`;
  if (!kids.length) return h + `<div class="card"><h3>Willkommen 👋</h3><p>Lege zuerst die Kinder an, die du betreust. Danach kannst du sie jeden Morgen mit einem Tipp „einchecken".</p><button class="btn go full" data-act="newkid">➕ Erstes Kind anlegen</button></div>`;
  h += `<div class="big"><b>${here.length}/${kids.length}</b><div>Kinder sind gerade da<div class="mute">${here.length ? 'Viel Spaß heute!' : 'Noch niemand eingecheckt'}</div></div></div>`;
  const qm = [['kinder','👧','Kinder','#e8efe5'],['kalender','📅','Kalender','#eee4d4'],['stunden','⏱️','Stunden','#f7e8e4'],['finanzen','💶','Geld','#fdf0cc'],['routine','🌿','Tagesplan','#e3ebdc'],['woche','🌱','Wochenplan','#f3e7da'],['hygiene','🧼','Hygiene','#e8efe5'],['ideen','🌈','Ideen','#fdf0cc'],['notizen','📝','Notizen','#eee4d4'],['dok','📁','Dokumente','#f7e8e4'],['liste','🛒','Einkauf','#e3ebdc'],['mehr','💾','Backup','#f3e7da']];
  h += `<div class="qm">${qm.map(([v,i,l,c]) => `<button data-act="tab" data-v="${v}"><i style="background:${c}">${i}</i>${l}</button>`).join('')}</div>`;
  const nxt = planFor(t).filter(x => !x.done).sort((a, b) => (a.time || '').localeCompare(b.time || '')).slice(0, 3);
  h += `<div class="card"><div class="row"><h3 class="grow">Als Nächstes</h3><button class="btn sm" data-act="tab" data-v="routine" style="flex:none">Tagesplan →</button></div>${nxt.map(x => `<div class="row sub" style="margin-top:8px;padding-top:8px"><span class="time">${esc(x.time || '—')}</span><div class="grow">${esc(x.title)}</div></div>`).join('') || '<p class="mute">Alles erledigt 🎉</p>'}</div>`;
  if (db.lastBackup === null || (Date.now() - db.lastBackup) > 14*864e5)
    h += `<div class="alert">💾 Du hast schon länger kein Backup gemacht. <a href="#" data-act="tab" data-v="mehr">Jetzt sichern</a></div>`;
  if (hints.length) h += `<div class="alert"><b>Wichtige Hinweise für heute</b>${hints.map(c => `<div style="margin-top:6px"><b>${esc(c.name)}:</b> ${[c.allergies && 'Allergie: '+esc(c.allergies), c.intolerances && 'Unverträglich: '+esc(c.intolerances), c.meds && 'Medikamente: '+esc(c.meds), c.notes && esc(c.notes)].filter(Boolean).join(' · ')}</div>`).join('')}</div>`;
  bdays.forEach(([c, d]) => h += `<div class="info">🎂 ${esc(c.name)} ${d === 0 ? 'hat heute Geburtstag!' : `hat in ${d} Tag${d===1?'':'en'} Geburtstag.`}</div>`);
  const upc = new Map();
  for (let i = 0; i <= 7; i++) { const d = new Date(); d.setDate(d.getDate() + i); eventsOn(dstr(d)).forEach(e => { if (!upc.has(e.id)) upc.set(e.id, [i, e]); }); }
  upc.forEach(([i, e]) => {
    const cls = e.type === 'closed' && i === 0 ? 'alert' : 'info', w = i === 0 ? 'Heute' : i === 1 ? 'Morgen' : 'In ' + i + ' Tagen';
    h += `<div class="${cls}" data-act="evedit" data-id="${e.id}" style="cursor:pointer">${EVT[e.type][0]} <b>${w}:</b> ${esc(e.title)}${e.time ? ' um ' + e.time + ' Uhr' : ''}</div>`;
  });
  db.files.map(f => [f, docStatus(f)]).filter(([f, s]) => s?.bad).forEach(([f, s]) => h += `<div class="alert" data-act="tab" data-v="dok" style="cursor:pointer">📁 <b>${esc(f.title)}</b>: ${s.t}</div>`);
  db.todo.filter(x => !x.done && x.due && x.due <= t).forEach(x => h += `<div class="info" data-act="tab" data-v="liste" style="cursor:pointer">✅ <b>${x.due < t ? 'Überfällig' : 'Heute'}:</b> ${esc(x.text)}</div>`);
  h += `<h2>Kinder</h2>`;
  kids.forEach(c => {
    const a = recs[c.id];
    let status = '', btns = '';
    if (!a) {
      status = '<span class="mute">Noch nicht da</span>';
      btns = `<button class="btn go" data-act="in" data-id="${c.id}">✅ Ist da</button><button class="btn sm" data-act="sick" data-id="${c.id}">🤒 Krank</button><button class="btn sm" data-act="vac" data-id="${c.id}">🏖️ Urlaub</button>`;
    } else if (a.type !== 'present') {
      status = `<b>${a.type === 'sick' ? '🤒 Krank heute' : '🏖️ Urlaub heute'}</b>`;
      btns = `<button class="btn sm" data-act="undo" data-id="${c.id}">↩︎ Rückgängig</button>`;
    } else if (!a.out) {
      status = `<b style="color:var(--pri-d)">● Da seit ${a.in} Uhr</b>`;
      btns = `<button class="btn out" data-act="out" data-id="${c.id}">👋 Wird abgeholt</button><button class="btn sm" data-act="edit" data-id="${c.id}" data-d="${t}">🕐 Zeit ändern</button>`;
    } else {
      status = `<b>Abgeholt</b> · ${a.in}–${a.out} Uhr · ${fmtH(Math.max(0, mins(a.out) - mins(a.in)))}`;
      btns = `<button class="btn sm" data-act="edit" data-id="${c.id}" data-d="${t}">🕐 Zeit ändern</button><button class="btn sm" data-act="undo" data-id="${c.id}">↩︎ Zurücksetzen</button>`;
    }
    if (!a || a.type === 'present') btns += `<button class="btn sm" data-act="docopen" data-id="${c.id}" data-d="${t}">📝 Tag dokumentieren</button>`;
    h += `<div class="card"><div class="row" data-act="view" data-id="${c.id}" style="cursor:pointer">${avatar(c)}<div class="grow"><h3>${esc(c.name)}</h3><div class="mute">${ageText(c.birth)}</div>${status}</div></div>${healthTags(c) ? `<div>${healthTags(c)}</div>` : ''}<div class="btns">${btns}</div></div>`;
  });
  return h;
}

function viewKinder() {
  let h = `<h1>Kinder</h1>`;
  if (!db.children.length) h += `<p class="mute">Noch keine Kinder angelegt.</p>`;
  db.children.slice().sort((a, b) => a.name.localeCompare(b.name, 'de')).forEach(c => {
    h += `<div class="card"><div class="row" data-act="view" data-id="${c.id}" style="cursor:pointer">${avatar(c)}<div class="grow"><h3>${esc(c.name)}</h3><div class="mute">${ageText(c.birth)}${c.hours ? ' · ' + c.hours + ' Std/Woche' : ''}</div>${healthTags(c)}</div><span style="font-size:24px;color:var(--mute)">›</span></div></div>`;
  });
  return h + `<div class="btns"><button class="btn go full" data-act="newkid">➕ Kind hinzufügen</button></div>`;
}

function viewStunden() {
  const [y, m] = ui.month.split('-').map(Number);
  let h = `<h1>Stunden</h1><div class="row" style="margin:8px 0"><button class="btn sm" data-act="mprev" style="flex:none">‹</button><div class="grow" style="text-align:center;font-size:20px;font-weight:700">${MONTHS[m-1]} ${y}</div><button class="btn sm" data-act="mnext" style="flex:none">›</button></div>`;
  if (!db.children.length) return h + `<p class="mute">Lege zuerst Kinder an.</p>`;
  db.children.forEach(c => {
    const s = monthStats(c, ui.month), pct = s.soll ? Math.min(100, Math.round(s.ist / s.soll * 100)) : 0;
    const diff = s.ist - s.soll;
    h += `<div class="card" data-act="days" data-id="${c.id}" style="cursor:pointer"><div class="row">${avatar(c)}<div class="grow"><h3>${esc(c.name)}</h3><div class="mute">Ist <b>${fmtH(s.ist)}</b> von ca. ${fmtH(s.soll)}</div></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="mini">${s.soll ? (diff >= 0 ? `+${fmtH(diff)} über Vertrag` : `${fmtH(-diff)} unter Vertrag`) : 'Keine Vertragsstunden hinterlegt'}</div>
    <div>${s.sick ? `<span class="tag">🤒 ${s.sick} Krankheitstag${s.sick===1?'':'e'}</span>` : ''}${s.vac ? `<span class="tag">🏖️ ${s.vac} Urlaubstag${s.vac===1?'':'e'}</span>` : ''}${s.missing ? `<span class="tag bad">⚠ ${s.missing}× Abholzeit fehlt</span>` : ''}</div></div>`;
  });
  return h + `<p class="mini">Das Soll ist die Vertragsstunden-Zahl auf die Werktage (Mo–Fr) des Monats umgerechnet; Schließtage und eigener Urlaub aus dem Kalender sind abgezogen, gesetzliche Feiertage nicht (trage sie als Schließtag ein). Tippe auf ein Kind für die einzelnen Tage.</p>`;
}

function readForm() {
  const g = id => $('#' + id)?.value ?? '';
  Object.assign(D, {name: g('f_name'), birth: g('f_birth'), start: g('f_start'), hours: g('f_hours'), feeP: g('f_feeP'), feeJ: g('f_feeJ'), feeF: g('f_feeF'), allergies: g('f_allergies'), intolerances: g('f_intolerances'), meds: g('f_meds'), notes: g('f_notes')});
  document.querySelectorAll('input[data-l]').forEach(el => { D[el.dataset.l][+el.dataset.i][el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value; });
}
function resizePhoto(file, max = 320) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', .8));
    };
    img.onerror = rej; img.src = url;
  });
}

function daysSheet(cid) {
  const c = kid(cid), s = monthStats(c, ui.month), [y, m] = ui.month.split('-').map(Number);
  const rows = s.recs.slice().sort((a, b) => a.date.localeCompare(b.date)).map(a => {
    const w = parseD(a.date).toLocaleDateString('de-DE', {weekday: 'short'});
    const txt = a.type === 'sick' ? '🤒 Krank' : a.type === 'vacation' ? '🏖️ Urlaub' : (a.in ? `${a.in}–${a.out || '?'} Uhr` + (a.out ? ' · ' + fmtH(Math.max(0, mins(a.out) - mins(a.in))) : ' <span class="tag bad">Abholzeit fehlt</span>') : '–');
    return `<div class="card" data-act="edit" data-id="${cid}" data-d="${a.date}" style="cursor:pointer"><b>${w}, ${fmtD(a.date)}</b><div>${txt}</div></div>`;
  }).join('');
  openSheet(`${sheetTop(esc(c.name))}<div class="mute">${MONTHS[m-1]} ${y} · Ist ${fmtH(s.ist)} von ca. ${fmtH(s.soll)}</div>
  ${rows || '<p class="mute">Keine Einträge in diesem Monat.</p>'}
  <div class="btns"><button class="btn go" data-act="edit" data-id="${cid}" data-d="">➕ Tag eintragen</button></div>`);
}
let E = null;
function entrySheet(cid, date) {

function dataToBlob(d) {
  const [head, b] = d.split(','), bin = atob(b), u = new Uint8Array(bin.length);

  return new Blob([u], {type: head.match(/:(.*?);/)[1]});
}

function yearData(y) {
  const rows = [];

    readFl(); const f = $('#flfile');
    f.onchange = async () => {
      const file = f.files[0]; if (!file) return;
      try {
        if (file.type.startsWith('image/')) FF.file = {name: file.name, type: 'image/jpeg', data: await resizePhoto(file, 1400)};
        else if (file.type === 'application/pdf' && file.size <= 2.5e6) FF.file = {name: file.name, type: file.type, data: await readFile(file)};
        else alert('Bitte ein Foto oder ein PDF bis 2,5 MB wählen.');
      } catch (e) { alert('Die Datei konnte nicht geladen werden.'); }
      flForm();
    };
    f.click();
  },
  flsave: () => {
    readFl(); if (!FF.title.trim()) FF.title = FF.cat;
    FF.title = FF.title.trim();
    if (FF.id) db.files[db.files.findIndex(x => x.id === FF.id)] = FF; else { FF.id = uid(); db.files.push(FF); }
    const id = FF.id; save(); FF = null; render(); flSheet(id);
  },
  fldel: (el) => { if (!confirm('Dokument wirklich löschen?')) return; db.files = db.files.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); },
  flopen: (el) => {
    const f = db.files.find(x => x.id === el.dataset.id).file, url = URL.createObjectURL(dataToBlob(f.data));
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.download = f.name; a.click();
  },
  ladd: (el) => {
    const k = el.dataset.k, inp = $('#' + k + '_in'), text = inp.value.trim(); if (!text) return inp.focus();
    db[k].push({id: uid(), text, done: false, due: k === 'todo' ? $('#todo_due').value : ''}); save(); render(); $('#' + k + '_in')?.focus();
  },
  scan: () => {
    const f = $('#scanfile');
    f.onchange = async () => {
      if (!f.files[0]) return;
      try { FD = {id: null, type: 'out', date: today(), cat: 'Lebensmittel', amt: '', text: 'Einkauf', photo: await resizePhoto(f.files[0], 1200)}; finForm(); }
      catch (e) { alert('Das Foto konnte nicht geladen werden.'); }
    };
    f.value = ''; f.click();
  },
  ltog: (el) => { const x = db[el.dataset.k].find(i => i.id === el.dataset.id); x.done = !x.done; save(); render(); },
  ldel: (el) => { db[el.dataset.k] = db[el.dataset.k].filter(i => i.id !== el.dataset.id); save(); render(); },
  lclear: (el) => { db[el.dataset.k] = db[el.dataset.k].filter(i => !i.done); save(); render(); },
  dday: (el) => { const d = parseD(curDay()); d.setDate(d.getDate() + +el.dataset.v); ui.day = dstr(d); render(); },
  rpdone: (el) => { const x = ensurePlan(curDay()).find(i => i.id === el.dataset.id); x.done = !x.done; save(); render(); },
  rpdel: (el) => { db.dayplan[curDay()] = ensurePlan(curDay()).filter(i => i.id !== el.dataset.id); save(); render(); },
  rpadd: () => {
    const title = $('#rp_title').value.trim(); if (!title) return alert('Bitte gib einen Programmpunkt ein.');
    ensurePlan(curDay()).push({id: 'c' + uid(), time: $('#rp_time').value || '', type: $('#rp_type').value, title, note: $('#rp_note').value.trim(), done: false}); save(); render();
  },
  rphase: (el) => { db.phase = el.dataset.v; save(); render(); },
  rtchk: (el) => { const k = curDay() + '|' + el.dataset.t; if (db.chk[k]) delete db.chk[k]; else db.chk[k] = true; save(); render(); },
  rtadd: () => { const text = $('#rt_text').value.trim(); if (!text) return alert('Bitte gib eine Aufgabe ein.'); db.customTasks.push({text, time: $('#rt_time').value || 'Flexibel', phase: db.phase || PHASES[0]}); save(); render(); },
  rtdel: (el) => { db.customTasks = db.customTasks.filter(t => t.text !== el.dataset.t); save(); render(); },
  rtreset: () => { Object.keys(db.chk).filter(k => k.startsWith(curDay() + '|')).forEach(k => delete db.chk[k]); save(); render(); },
  hchk: (el) => { const k = 'h' + curDay() + '|' + el.dataset.t; if (db.chk[k]) delete db.chk[k]; else db.chk[k] = true; save(); render(); },
  hadd: () => { const t = $('#h_new').value.trim(); if (!t) return; db.customHyg.push(t); save(); render(); },
  hdel: (el) => { db.customHyg = db.customHyg.filter(t => t !== el.dataset.t); save(); render(); },
  wadd: () => {
    const title = $('#w_title').value.trim(); if (!title) return alert('Bitte gib ein Angebot ein.');
    db.week.push({id: uid(), day: $('#w_day').value, area: $('#w_area').value, title, note: $('#w_note').value.trim()}); ui.wd = null; save(); render();
  },
  wdel: (el) => { db.week = db.week.filter(x => x.id !== el.dataset.id); save(); render(); },
  iadd: (el) => { const a = activityLibrary[+el.dataset.i]; ui.wd = {day: weekDayOf(curDay()), area: areaOf(a.cat), title: a.title, note: 'Material: ' + a.materials + '\nAblauf: ' + a.how + '\nAnpassung/Sicherheit: ' + a.adapt}; ui.tab = 'woche'; render(); window.scrollTo(0, 0); },
  icircle: () => { const c = weekdayCircle[String(parseD(curDay()).getDay())] || weekdayCircle['1']; ui.wd = {day: weekDayOf(curDay()), area: 'Sprache', title: c.title, note: c.song + '; ' + c.activity}; ui.tab = 'woche'; render(); window.scrollTo(0, 0); },
  fprev: () => shiftFm(-1), fnext: () => shiftFm(1),
  paytoggle: (el) => {
    const c = kid(el.dataset.id), k = el.dataset.k, p = payRec(c.id, ui.fm, k);
    if (p) db.pay = db.pay.filter(x => x !== p);
    else db.pay.push({id: uid(), child: c.id, name: c.name, month: ui.fm, kind: k, amt: num(c[FEES.find(f => f[1] === k)[0]]), date: today()});
    save(); render();
  },
  finnew: (el) => { FD = {id: null, type: el.dataset.v, date: today(), cat: '', amt: '', text: '', photo: ''}; finForm(); },
  finedit: (el) => { FD = {...db.fin.find(x => x.id === el.dataset.id)}; finForm(); },
  fintype: (el) => { readFin(); FD.type = el.dataset.v; FD.cat = ''; finForm(); },
  finphoto: () => { readFin(); const f = $('#finfile'); f.onchange = async () => { if (!f.files[0]) return; try { FD.photo = await resizePhoto(f.files[0], 900); } catch (e) { alert('Das Foto konnte nicht geladen werden.'); } finForm(); }; f.click(); },
  finnophoto: () => { readFin(); FD.photo = ''; finForm(); },
  finsave: () => {
    readFin(); const amt = num(FD.amt);
    if (!FD.date || amt <= 0) return alert('Bitte Datum und einen Betrag größer 0 eingeben.');
    const rec = {...FD, amt, cat: FD.cat || CATS[FD.type][0], text: FD.text.trim()};
    if (rec.id) db.fin[db.fin.findIndex(x => x.id === rec.id)] = rec; else { rec.id = uid(); db.fin.push(rec); }
    save(); FD = null; closeSheet(); render();
  },
  findel: () => { if (!confirm('Eintrag löschen?')) return; db.fin = db.fin.filter(x => x.id !== FD.id); save(); FD = null; closeSheet(); render(); },
  yearopen: yearSheet,
  yprev: () => { ui.fy--; yearSheet(); }, ynext: () => { ui.fy++; yearSheet(); },
  yprint: () => window.print(),
  yexcel: () => {
    const y = String(ui.fy), q = v => '"' + String(v).replace(/"/g, '""') + '"';
    const lines = [['Datum', 'Art', 'Kategorie', 'Beschreibung', 'Betrag (EUR)'].join(';')].concat(yearData(y).rows.map(r => [fmtD(r[0]), r[1], q(r[2]), q(r[3]), String(r[4]).replace('.', ',')].join(';')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}));
    a.download = `casabambini-einnahmen-ausgaben-${y}.csv`; a.click();
  },
  cprev: () => { shiftCal(-1); }, cnext: () => { shiftCal(1); },
  calday: (el) => daySheet(el.dataset.d),
  evnew: (el) => evSheet(null, el.dataset.d),
  evedit: (el) => evSheet(el.dataset.id),
  evsave: () => {
    const type = $('#v_type').value, date = $('#v_date').value, end = $('#v_end').value;
    if (!date) return alert('Bitte ein Datum wählen.');
    if (end && end < date) return alert('Das Enddatum liegt vor dem Startdatum.');
    const rec = {type, title: $('#v_title').value.trim() || EVT[type][1].split(' (')[0], date, end: end && end !== date ? end : '', time: $('#v_time').value, note: $('#v_note').value.trim()};
    if (EV.id) Object.assign(db.events.find(x => x.id === EV.id), rec); else db.events.push({id: uid(), ...rec});
    save(); EV = null; ui.cal = date.slice(0, 7); render(); daySheet(date);
  },
  evdel: () => { if (!confirm('Eintrag löschen?')) return; const d = EV.date; db.events = db.events.filter(x => x.id !== EV.id); save(); EV = null; render(); daySheet(d); },
  docopen: (el) => docSheet(el.dataset.id, el.dataset.d),
  docday: (el) => { saveNote(); const d = parseD(DOC.date); d.setDate(d.getDate() + +el.dataset.v); docSheet(DOC.cid, dstr(d)); },
  docmeal: () => { saveNote(); const d = getDoc(DOC.cid, DOC.date, true); d.meals.push({t: $('#d_time').value, what: $('#d_meal').value, amt: $('#d_amt').value}); sortT(d.meals); save(); docSheet(DOC.cid, DOC.date, true); },
  docsleep: () => { saveNote(); const d = getDoc(DOC.cid, DOC.date, true); d.sleeps.push({from: $('#d_time').value, to: ''}); sortT(d.sleeps, 'from'); save(); docSheet(DOC.cid, DOC.date, true); },
  docwake: () => { saveNote(); const d = getDoc(DOC.cid, DOC.date, true), s = d.sleeps.filter(x => !x.to).pop(); if (s) s.to = $('#d_time').value; save(); docSheet(DOC.cid, DOC.date, true); },
  docdiaper: (el) => { saveNote(); const d = getDoc(DOC.cid, DOC.date, true); d.diapers.push({t: $('#d_time').value, kind: el.dataset.v}); sortT(d.diapers); save(); docSheet(DOC.cid, DOC.date, true); },
  docmood: (el) => { saveNote(); const d = getDoc(DOC.cid, DOC.date, true); d.mood = d.mood === el.dataset.v ? '' : el.dataset.v; save(); docSheet(DOC.cid, DOC.date, true); },
  docdel: (el) => { saveNote(); const d = getDoc(DOC.cid, DOC.date, true); d[el.dataset.k].splice(+el.dataset.i, 1); save(); docSheet(DOC.cid, DOC.date, true); },
  docphoto: () => { saveNote(); const f = $('#docfile'); f.onchange = async () => { if (!f.files[0]) return; try { getDoc(DOC.cid, DOC.date, true).photos.push(await resizePhoto(f.files[0], 640)); save(); } catch (e) { alert('Das Foto konnte nicht geladen werden.'); } docSheet(DOC.cid, DOC.date, true); }; f.click(); },
  docnophoto: (el) => { saveNote(); getDoc(DOC.cid, DOC.date, true).photos.splice(+el.dataset.i, 1); save(); docSheet(DOC.cid, DOC.date, true); },
  obsopen: (el) => obsSheet(el.dataset.id),
  obsadd: () => {
    const text = $('#o_text').value.trim(), date = $('#o_date').value;
    if (!text || !date) return alert('Bitte Datum und eine kurze Beobachtung eingeben.');
    db.obs.push({id: uid(), child: OB, date, area: $('#o_area').value, text}); save(); obsSheet(OB);
  },
  obsdel: (el) => { if (!confirm('Beobachtung löschen?')) return; db.obs = db.obs.filter(o => o.id !== el.dataset.id); save(); obsSheet(OB, true); },
  newkid: () => { D = newDraft(); formSheet(); },
  view: (el) => childSheet(el.dataset.id),
  editkid: (el) => { D = JSON.parse(JSON.stringify(kid(el.dataset.id))); D.hours = D.hours ?? ''; formSheet(); },
  delkid: (el) => {
    const c = kid(el.dataset.id);
    if (!confirm(`„${c.name}" wirklich löschen? Auch alle Anwesenheitseinträge dieses Kindes gehen dabei verloren.`)) return;
    db.children = db.children.filter(x => x.id !== c.id); db.att = db.att.filter(a => a.child !== c.id); db.docs = db.docs.filter(a => a.child !== c.id); db.obs = db.obs.filter(a => a.child !== c.id); save(); closeSheet(); render();
  },
  photo: () => { readForm(); const f = $('#photofile'); f.onchange = async () => { if (f.files[0]) { try { D.photo = await resizePhoto(f.files[0]); } catch (e) { alert('Das Foto konnte nicht geladen werden.'); } formSheet(); } }; f.click(); },
  nophoto: () => { readForm(); D.photo = ''; formSheet(); },
  addrow: (el) => { readForm(); D[el.dataset.l].push(el.dataset.l === 'contacts' ? {name:'', rel:'', phone:'', emergency:false} : {name:'', rel:''}); formSheet(); },
  rmrow: (el) => { readForm(); D[el.dataset.l].splice(+el.dataset.i, 1); formSheet(); },
  savekid: () => {
    readForm();
    if (!D.name.trim()) { alert('Bitte einen Namen eingeben.'); $('#f_name').focus(); return; }
    D.name = D.name.trim(); D.contacts = D.contacts.filter(p => p.name.trim() || p.phone.trim()); D.pickup = D.pickup.filter(p => p.name.trim());
    const id = D.id || uid();
    if (D.id) db.children[db.children.findIndex(c => c.id === D.id)] = D; else { D.id = id; db.children.push(D); }
    save(); D = null; render(); childSheet(id);
  },
  in: (el) => { setAtt(el.dataset.id, today(), {type: 'present', in: nowT(), out: ''}); render(); },
  out: (el) => { setAtt(el.dataset.id, today(), {out: nowT()}); render(); },
  sick: (el) => { setAtt(el.dataset.id, today(), {type: 'sick', in: '', out: ''}); render(); },
  vac: (el) => { setAtt(el.dataset.id, today(), {type: 'vacation', in: '', out: ''}); render(); },
  undo: (el) => { delAtt(el.dataset.id, today()); render(); },
  edit: (el) => entrySheet(el.dataset.id, el.dataset.d),
  days: (el) => daysSheet(el.dataset.id),
  saveentry: () => {
    const date = $('#e_date').value, type = $('#e_type').value, tin = $('#e_in').value, tout = $('#e_out').value;
    if (!date) return alert('Bitte ein Datum wählen.');
    if (type === 'present' && tin && tout && mins(tout) < mins(tin)) return alert('Die Abholzeit liegt vor der Bringzeit.');
    if (E.orig && E.orig !== date) delAtt(E.cid, E.orig);
    setAtt(E.cid, date, {type, in: type === 'present' ? tin : '', out: type === 'present' ? tout : ''});
    const cid = E.cid; if (date.slice(0, 7) !== ui.month) ui.month = date.slice(0, 7);
    E = null; render(); daysSheet(cid);
  },
  delentry: () => { if (!confirm('Eintrag löschen?')) return; delAtt(E.cid, E.orig); const cid = E.cid; E = null; render(); daysSheet(cid); },
  mprev: () => shiftMonth(-1), mnext: () => shiftMonth(1),
  export: async () => {
    const blob = new Blob([JSON.stringify(await makeVault())], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `casabambini-backup-${today()}.kbk`; a.click();
    db.lastBackup = Date.now(); save(); render();
  },
  import: () => {
    const f = $('#impfile'); f.value = '';
    f.onchange = async () => {
      if (!f.files[0]) return;
      let v; try { v = JSON.parse(await f.files[0].text()); if (!v.salt || !v.iv || !v.data) throw 0; } catch (e) { return alert('Das ist keine gültige Backup-Datei.'); }
      const pw = prompt('Passwort, mit dem dieses Backup erstellt wurde:'); if (!pw) return;
      try {
        const r = await decryptVault(v, pw);
        if (!confirm(`Backup enthält ${r.db.children.length} Kind(er). Alle aktuellen Daten werden dadurch ersetzt. Fortfahren?`)) return;
        db = r.db; key = r.key; salt = r.salt; norm(); await save(); alert('Backup wurde eingespielt. Ab jetzt gilt das Passwort des Backups.'); render();
      } catch (e) { alert('Falsches Passwort oder beschädigte Datei.'); }
    };
    f.click();
  },
  chpw: async () => {
    const p1 = prompt('Neues Passwort (mindestens 6 Zeichen):'); if (!p1) return;
    if (p1.length < 6) return alert('Zu kurz.');
    if (prompt('Neues Passwort wiederholen:') !== p1) return alert('Die Passwörter sind nicht gleich.');
    salt = crypto.getRandomValues(new Uint8Array(16)); key = await deriveKey(p1, salt); await save(); alert('Passwort geändert. Alte Backups benötigen weiterhin das alte Passwort.');
  }
};
function shiftFm(d) { const [y, m] = ui.fm.split('-').map(Number), n = new Date(y, m - 1 + d, 1); ui.fm = `${n.getFullYear()}-${pad(n.getMonth() + 1)}`; render(); }
function shiftCal(d) { const [y, m] = ui.cal.split('-').map(Number), n = new Date(y, m - 1 + d, 1); ui.cal = `${n.getFullYear()}-${pad(n.getMonth() + 1)}`; render(); }
function shiftMonth(d) { const [y, m] = ui.month.split('-').map(Number), n = new Date(y, m - 1 + d, 1); ui.month = `${n.getFullYear()}-${pad(n.getMonth() + 1)}`; render(); }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  // Klicks auf Buttons innerhalb klickbarer Karten sollen nicht die Karte öffnen
  if (el.dataset.act === 'view' || el.dataset.act === 'days') { if (e.target.closest('button,a.btn') ) return; }
  A[el.dataset.act]?.(el);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  if (!db) doUnlock(); else if (/^(shop|todo)_in$/.test(e.target.id)) A.ladd({dataset: {k: e.target.id.slice(0, 4)}});
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'notes_in' && db) { db.notes[curDay()] = e.target.value; clearTimeout(noteTimer); noteTimer = setTimeout(save, 600); }
  else if (id === 'idea_q' && db) { ui.iq = e.target.value; render(); const el = $('#idea_q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
});
document.addEventListener('change', e => {
  if (!db) return;
  if (e.target.id === 'idea_cat') { ui.icat = e.target.value; render(); } else if (e.target.id === 'idea_age') { ui.iage = e.target.value; render(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && db) { clearTimeout(lockTimer); lockTimer = setTimeout(lock, 5*60*1000); } else touch(); });

renderLock();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
